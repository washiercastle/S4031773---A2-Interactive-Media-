
<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LockedOut</title>
    <!-- I chose the name locked out as a counter to locked in, representing the -->

    
    <!-- Font: Merriweather Sans as i liked it and it was categorized as calming on google fonts lmaooo I'll use it as heading font.-->
    <!-- Noto Sans is a popular and versatile font, it had 3 variables and was a good compliment to merriweather as the paragraph font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">    <link rel="stylesheet" href="reset.css" />
    
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <!-- Header Section -->
    <header>
      <h1>LockedOut</h1>
    </header>

    <section>
        <p>What are you doing up so late?</p>
    </section>


    <!-- I find the pomodoro technique really helpful personally, that's why it has to be the main focus of the website, and I will build the rest of the functionalities around it. The timer will be displayed prominently at the top of the page, with a clean and minimalist design to minimize distractions. The timer will have a circular progress bar that fills up as time passes, providing a visual representation of the remaining time. 
    tutorial I followed: https://youtu.be/qvw-jzHra-o?si=Skc3jlhnFoMW6NKz -->
    <div id="timer">
      <h2>Pomodoro Timer</h2>
      <div class="circle">
        <svg>       <!-- Scalable Vector Graphics, an image in code -->
        <!-- Background circle -->
        <circle id="bgcircle"
          cx="120"
          cy="120"
          r="100"   ></circle>
        <!-- Progress circle -->
        <circle id="circle"
          cx="120"
          cy="120"
          r="100" ></circle>
        </svg>
        <div id="timer-display">00:00</div>
      </div>
    </div>
      


    <!-- Main Content Section -->
    <main class="container">
      <!-- Media Player Section -->
      <div class="media-player">
        <video id="custom-video-player" controls>
          <source
            src="https://thelongesthumstore.sgp1.cdn.digitaloceanspaces.com/IM-2250/miac.mp4"
            type="video/mp4"
          />
        </video>
        <div class="custom-controls">
          <button id="play-pause-btn" onclick="togglePlayPause()">
            <img
              id="play-pause-img"
              src="https://img.icons8.com/ios-glyphs/30/play--v1.png"
              alt="Play Button"
              width="24"
              height="24"
            />
          </button>
          <!-- add the missing buttons or functionality here -->
          <div class="progress-bar">
            <span id="progress-bar-fill"></span>

          <button id="volume-btn" onclick="toggleVolume()">
            <img
              id="volume-img"
              src="https://img.icons8.com/ios-glyphs/30/volume--v1.png"
              alt="Volume Button"
              width="24"
              height="24"
            />
          </button>

          </div>
        </div>
      </div>
        
    </main>

    <!-- For the navigation bar and any pop-ups and modules, best practice is to put them outside of the main component near the end of body
    No directory in the navigation bar, I will customize it to contain the following elements
    - A sound adjuster using Web Audio API, sound can be adjusted for both timer and media player
    - A Mood adjuster that changes the background color and type of music is playing
    - A timer customizer, for pomodoro, different users prefer different time intervals, so I will allow users to customize the timer to their preference
    - A mini wheel of luck, for users to play when they are taking a break from work or study, to minimize friction while switching between work and break mode, and to make the website more fun and engaging.  -->
    
    
    <nav id="navbar">
      <ul>
        <li><a href="#">Ambience</a></li>
        <li><a href="#">Aesthetic</a></li>
        <li><a href="#">Timer</a></li>
        <li><a href="#">Game</a></li>
        <!-- Other functionalities to be added: mini game, Audio API, No volume slider, time display, or Pomodoro section styles -->
      </ul>
    </nav>

    <div class="popup">
      <div class="popupicons">
        <div class="progress-bar">
          <button>
          <img src="/stuff/audio.gif" alt="Volume Icon Gif" width="30" height="30"/>
          </button>
          <span id="progress-bar-fill"></span>
        </div>
      </div>
    </div>

    <div class="popup">
      <h2>Timer Customizer</h2>
      <div class="popupicons">
        <div class="input">
          <label>Minutes
            <input type="number" id="customeminutes" min="10" max="120" value="25">
            <!-- Value=default, initially 25 minutes, adjustable for users up to 2 hours because any more than that without break is not productive  -->
          </label>
        </div>
        <button>
          <img src="/stuff/audio.gif" alt="Color Icon Gif" width="30" height="30"/>
        </button>
        <button>
          <img src="/stuff/audio.gif" alt="Color Icon Gif" width="30" height="30"/>
        </button>
        <button>
          <img src="/stuff/audio.gif" alt="Color Icon Gif" width="30" height="30"/>
        </button>

        <h2>Timer Volume</h2>
        <div class="progress-bar">
          <button>
          <img src="/stuff/audio.gif" alt="Volume Icon Gif" width="30" height="30"/>
          </button>
          <span id="progress-bar-fill"></span>
        </div>
      </div>
      </div>




    <!-- Footer Section -->
    <footer>
      <p>&copy; 2024 Media Player Website. All rights reserved.</p>
      <a href="https://icons8.com/icon/59862/play">Play</a> icon by
      <a href="https://icons8.com">Icons8</a>
      <a href="https://icons8.com/icon/61012/pause">Pause</a> icon by
      <a href="https://icons8.com">Icons8</a>
    </footer>
  </body>
</html>
